# ILMDAS local development stack.
# Django runs IN Docker (bind-mounted source). Next.js runs NATIVELY (`npm run dev`).
# No Celery, Redis, Nginx, or PostGIS in this stack.
#
#   Start:    docker compose -f docker-compose.dev.yml up -d --build
#   Migrate:  docker compose -f docker-compose.dev.yml exec backend python manage.py migrate
#   Logs:     docker compose -f docker-compose.dev.yml logs -f backend
#   Stop:     docker compose -f docker-compose.dev.yml down
#
# Backend env uses Docker service hostnames (postgres / elasticsearch / minio).

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.development
  ILMDAS_SKIP_ENV_FILE: "1"
  SECRET_KEY: local-development-only-change-me # pragma: allowlist secret
  DATABASE_URL: postgres://ilmdas:ilmdas@postgres:5432/ilmdas # pragma: allowlist secret
  ILMDAS_ENVIRONMENT: development
  ALLOWED_HOSTS: localhost,127.0.0.1,backend
  CORS_ALLOWED_ORIGINS: http://localhost:3010
  ELASTICSEARCH_URL: http://elasticsearch:9200
  ELASTICSEARCH_INDEX: ilmdas-catalogue
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: ilmdas # pragma: allowlist secret
  S3_SECRET_ACCESS_KEY: ilmdas-local-only # pragma: allowlist secret
  S3_BUCKET_NAME: ilmdas-files
  S3_REGION: us-east-1
  IIIF_ENDPOINT: ""
  IIIF_FIXTURE_IDENTIFIER: fixture-image

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile.dev
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ilmdas
      POSTGRES_PASSWORD: ilmdas # pragma: allowlist secret
      POSTGRES_DB: ilmdas
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ilmdas_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilmdas -d ilmdas"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - ilmdas_elasticsearch:/usr/share/elasticsearch/data

  # S3-compatible object storage (Silo; MinIO-compatible API).
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ilmdas
      MINIO_ROOT_PASSWORD: ilmdas-local-only # pragma: allowlist secret
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - ilmdas_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # One-shot: create the private app bucket before backend starts and enable versioning.
  minio-init:
    image: pgsty/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ilmdas
      MINIO_ROOT_PASSWORD: ilmdas-local-only # pragma: allowlist secret
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/ilmdas-files
        mc anonymous set none local/ilmdas-files
        mc version enable local/ilmdas-files
    restart: "no"

volumes:
  ilmdas_postgres:
  ilmdas_elasticsearch:
  ilmdas_minio:
